<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="Nullius mark: a claimed shape and a verified shape, checked against each other">
  <title>Nullius</title>
  <!-- The claim: stated, but unconfirmed. -->
  <path d="M40 10 66 25v30L40 70 14 55V25z"
        fill="none" stroke="#8b93a7" stroke-width="3"
        stroke-dasharray="7 5" stroke-linejoin="round" opacity=".85"/>
  <!-- The chain's answer: solid, and offset, because the two are not the same source. -->
  <path d="M56 26 82 41v30L56 86 30 71V41z"
        fill="none" stroke="#f0b90b" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- The check happens where they overlap. -->
  <path d="M41 55.5 50 64l16-17"
        fill="none" stroke="#f0b90b" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
